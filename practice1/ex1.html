<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴퓨터와 가위바위보 게임</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #f4f4f9;
    }
    .container {
        background-color: white;
        display: inline-block;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .buttons button {
        font-size: 18px;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        transition: 0.2s;
    }
    .buttons button:hover {
        background-color: #0056b3;
    }
    .result-box{
        margin-top: 20px;
        font-size: 20px;
    }
    #result-text {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        margin-top: 15px;
    }
</style>

<body>
    <div class="container">
        <h1>컴퓨터와 가위, 바위, 보 게임</h1>
        <p>아래 버튼 중 하나를 클릭하세요!</p>

        <div class="buttons">
            <button onclick="playGame(1)">✌️ 가위 (1)</button>
            <button onclick="playGame(2)">✊ 바위 (2)</button>
            <button onclick="playGame(3)">✋ 보 (3)</button>
        </div>

        <div class="result-box">
            <p>나: <span id="user-choice">-</span></p>
            <p>컴퓨터: <span id="com-choice">-</span></p>
            <div id="result-text">버튼을 눌러 게임을 시작하세요!</div>
        </div>
    </div>

    <script src="ex1.js" defer></script>
</body>

</html>
